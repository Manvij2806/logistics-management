<div class="modal-overlay" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Edit User</h2>
      <button class="btn-close" (click)="close()">×</button>
    </div>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="modal-body">

        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" [value]="user.username" disabled>
        </div>

        <div class="form-group">
          <label for="edit_full_name">Full Name</label>
          <input id="edit_full_name" type="text" formControlName="full_name" class="form-control"
            [class.is-invalid]="f['full_name'].touched && f['full_name'].invalid">
          <div class="error-msg" *ngIf="f['full_name'].touched && f['full_name'].invalid">
            Full name must contain only letters and spaces (min 2 chars).
          </div>
        </div>

        <div class="form-group">
          <label for="edit_email">Email</label>
          <input id="edit_email" type="email" formControlName="email" class="form-control"
            [class.is-invalid]="f['email'].touched && f['email'].invalid">
          <div class="error-msg" *ngIf="f['email'].touched && f['email'].invalid">
            Enter a valid email address.
          </div>
        </div>

        <div class="form-group">
          <label for="edit_phone_number">Phone No</label>
          <input id="edit_phone_number" type="tel" formControlName="phone_number" class="form-control"
            placeholder="e.g. +1 555-123-4567"
            [class.is-invalid]="f['phone_number'].touched && f['phone_number'].invalid">
          <div class="error-msg" *ngIf="f['phone_number'].touched && f['phone_number'].invalid">
            Enter a valid phone number (7–20 digits).
          </div>
        </div>

        <div class="form-group">
          <label for="edit_role">Role</label>
          <select id="edit_role" formControlName="role" class="form-control"
            [class.is-invalid]="f['role'].touched && f['role'].invalid">
            <option value="" disabled>Select a role</option>
            <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
          </select>
        </div>

        <!-- City (Working City) -->
        <div class="form-group" *ngIf="userForm.get('role')?.value !== 'Admin'">
          <label for="edit_city">Working City</label>
          <select id="edit_city" formControlName="city" class="form-control">
            <option value="">None / All Cities</option>
            <option *ngFor="let c of cities" [value]="c">{{ c }}</option>
          </select>
        </div>

        <div class="api-error" *ngIf="submitError()">{{ submitError() }}</div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" (click)="close()" [disabled]="isSubmitting()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">Save Changes</button>
      </div>
    </form>
  </div>
</div>
