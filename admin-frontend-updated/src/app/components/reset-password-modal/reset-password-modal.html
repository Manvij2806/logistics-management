<div class="modal-overlay" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Reset Password</h2>
      <button class="btn-close" (click)="close()">×</button>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <div class="modal-body">
        <p class="modal-description">
          Set a new password for <strong>{{ user.full_name }}</strong> ({{ user.email }}).
        </p>

        <div class="form-group">
          <label for="new_password">New Password</label>
          <input id="new_password" type="password" formControlName="password" class="form-control" [class.is-invalid]="f['password'].touched && f['password'].invalid">
          <div class="error-msg" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
            Password must be at least 6 characters.
          </div>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input id="confirm_password" type="password" formControlName="confirmPassword" class="form-control" [class.is-invalid]="f['confirmPassword'].touched && f['confirmPassword'].invalid">
        </div>

        <div class="api-success" *ngIf="submitSuccess()">
          Password successfully reset.
        </div>

        <div class="api-error" *ngIf="submitError()">
          {{ submitError() }}
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" (click)="close()" [disabled]="isSubmitting()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">Reset Password</button>
      </div>
    </form>
  </div>
</div>
