<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>LogisticsPro</h1>
      <p>Dispatcher Portal &mdash; Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input id="username" type="text" formControlName="username" class="form-control" [class.is-invalid]="f['username'].touched && f['username'].invalid">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" class="form-control" [class.is-invalid]="f['password'].touched && f['password'].invalid">
      </div>

      <div class="api-error" *ngIf="loginError()">{{ loginError() }}</div>

      <button type="submit" class="btn btn-primary login-btn" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
