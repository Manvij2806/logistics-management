<div class="page-content">
  <div class="page-header">
    <div class="header-text">
      <h2>Dashboard</h2>
      <p>Live overview of deliveries and agents</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" (click)="loadStats()" [disabled]="isLoading()">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="api-error" *ngIf="loadError()">{{ loadError() }}</div>

  <div class="stats-grid" *ngIf="!isLoading() || stats()">
    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-label">Total Deliveries</span>
        <div class="stat-icon stat-icon-total">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1" />
          </svg>
        </div>
      </div>
      <span class="stat-value">{{ stats()?.total_deliveries ?? 0 }}</span>
    </div>

    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-label">Active Deliveries</span>
        <div class="stat-icon stat-icon-active">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
      </div>
      <span class="stat-value active">{{ stats()?.active_deliveries ?? 0 }}</span>
    </div>

    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-label">Total Agents</span>
        <div class="stat-icon stat-icon-total">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </div>
      </div>
      <span class="stat-value">{{ stats()?.total_agents ?? 0 }}</span>
    </div>

    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-label">Active Agents</span>
        <div class="stat-icon stat-icon-active">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
      </div>
      <span class="stat-value active">{{ stats()?.active_agents ?? 0 }}</span>
    </div>
  </div>

  <div *ngIf="isLoading() && !stats()" class="placeholder-card">
    <p>Loading dashboard stats&hellip;</p>
  </div>
</div>
