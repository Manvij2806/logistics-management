<div class="topbar">
  <div class="topbar-left">
    <!-- Left side spacing / logo area if needed -->
  </div>
  <div class="topbar-right" style="position: relative; display: flex; align-items: center;">
    <!-- Logistics AI Assistant Sparkles Button -->
    <button class="ai-chat-btn" (click)="openAiChat()" title="Logistics AI Assistant" style="margin-right: 15px; background: none; border: none; font-size: 1.25rem; color: #6366f1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 8px; border-radius: 50%; transition: background-color 0.2s;">
      <i class="pi pi-sparkles" style="font-size: 1.25rem;"></i>
    </button>

    <button class="topbar-icon-btn" (click)="toggleNotifications()">
      <i class="pi pi-bell"></i>
      <span class="badge notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
    </button>

    <!-- Notifications Dropdown -->
    <div class="notifications-dropdown" *ngIf="showNotifications">
      <div class="dropdown-header">
        <h3>Notifications</h3>
        <button class="mark-read-btn" (click)="markAllAsRead($event)">Mark all as read</button>
      </div>
      <div class="notifications-list">
        <div 
          class="notification-item" 
          *ngFor="let n of notifications" 
          [class.unread]="n.unread"
          (click)="markAsRead(n)"
        >
          <div class="icon-container" [style.background-color]="n.color + '15'" [style.color]="n.color">
            <i [class]="n.icon"></i>
          </div>
          <div class="notification-content">
            <div class="notification-title-row">
              <span class="item-title">{{ n.title }}</span>
              <span class="item-time">{{ n.time }}</span>
            </div>
            <p class="item-message">{{ n.message }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="topbar-divider"></div>
    <div class="user-profile">
      <div class="user-avatar-circle">{{ getUserInitials() }}</div>
      <div class="user-details">
        <div class="user-display-name">{{ getUserName() }}</div>
        <div class="user-role">{{ getUserRole() }}</div>
      </div>
    </div>
  </div>
</div>
