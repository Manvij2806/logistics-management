<div class="topbar">
  <div class="topbar-left">
    <!-- Left side spacing / logo area if needed -->
  </div>
  <div class="topbar-right" style="position: relative; display: flex; align-items: center;">
    <!-- Logistics AI Assistant Sparkles Button -->
    <button class="ai-chat-btn" (click)="openAiChat()" title="Logistics AI Assistant" style="margin-right: 15px; background: none; border: none; font-size: 1.25rem; color: #6366f1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 8px; border-radius: 50%; transition: background-color 0.2s;">
      <i class="pi pi-sparkles" style="font-size: 1.25rem;"></i>
    </button>

    <button class="topbar-icon-btn" (click)="toggleNotifications()">
      <i class="pi pi-bell"></i>
      <span class="badge notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
    </button>

    <!-- Notifications Dropdown -->
    <div class="notifications-dropdown" *ngIf="showNotifications">
      <div class="dropdown-header">
        <h3>Notifications</h3>
        <button class="mark-read-btn" (click)="markAllAsRead($event)">Mark all as read</button>
      </div>
      <div class="notifications-list">
        <div 
          class="notification-item" 
          *ngFor="let n of notifications" 
          [class.unread]="n.unread"
          (click)="markAsRead(n)"
        >
          <div class="icon-container" [style.background-color]="n.color + '15'" [style.color]="n.color">
            <i [class]="n.icon"></i>
          </div>
          <div class="notification-content">
            <div class="notification-title-row">
              <span class="item-title">{{ n.title }}</span>
              <span class="item-time">{{ n.time }}</span>
            </div>
            <p class="item-message">{{ n.message }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="topbar-divider"></div>
    <div class="user-profile">
      <div class="user-avatar-circle">{{ getUserInitials() }}</div>
      <div class="user-details">
        <div class="user-display-name">{{ getUserName() }}</div>
        <div class="user-role">{{ getUserRole() }}</div>
      </div>
    </div>
  </div>
</div>

<!-- Real-Time Dispatcher Notifications Toast Container -->
<div class="custom-toast-container" style="position: fixed; top: 80px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;">
  <div *ngFor="let toast of activeToasts" class="custom-toast" style="background: rgba(255, 255, 255, 0.95); border-left: 6px solid #8b5cf6; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); padding: 16px; border-radius: 8px; width: 340px; pointer-events: auto; display: flex; align-items: flex-start; gap: 12px; font-family: 'Outfit', sans-serif; backdrop-filter: blur(8px); border: 1px solid #eaecf0; border-top-left-radius: 4px; border-bottom-left-radius: 4px; animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
    <i class="pi pi-compass" style="color: #8b5cf6; font-size: 20px; margin-top: 2px;"></i>
    <div style="flex: 1;">
      <h4 style="margin: 0 0 4px 0; font-size: 14px; font-weight: 700; color: #1e1b4b; text-align: left;">{{ toast.title }}</h4>
      <p style="margin: 0; font-size: 12px; color: #4b5563; line-height: 1.4; text-align: left;">{{ toast.message }}</p>
    </div>
  </div>
</div>
