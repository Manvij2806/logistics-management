<aside class="sidebar" [class.collapsed]="!isExpanded()">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>
      @if (isExpanded()) {
        <div class="brand-text">
          <div class="brand-name">LogisticsPro</div>
          <div class="brand-sub">Customer Portal</div>
        </div>
      }
    </div>

    <button
      type="button"
      class="toggle-btn"
      (click)="toggle()"
      [attr.title]="isExpanded() ? 'Collapse sidebar' : 'Expand sidebar'"
      [attr.aria-label]="isExpanded() ? 'Collapse sidebar' : 'Expand sidebar'"
    >
      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        @if (isExpanded()) {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
        }
      </svg>
    </button>
  </div>

  @if (isExpanded()) {
    <div class="sidebar-search">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input
        type="text"
        class="search-input"
        placeholder="Search menu..."
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
      />
    </div>
  }

  <nav class="nav">
    @for (item of filteredMenuItems(); track item.id) {
      <button
        type="button"
        class="nav-item"
        [class.active]="activeView === item.id"
        (click)="selectView(item.id)"
        [attr.title]="!isExpanded() ? item.label : null"
      >
        @switch (item.icon) {
          @case ('dashboard') {
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
          }
          @case ('book-shipment') {
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
          }
          @case ('track') {
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          }
          @case ('assistant') {
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9.813 15.904L9 21L8.188 15.904L3 15L8.188 14.096L9 9L9.813 14.096L15 15L9.813 15.904Z M19.071 4.929a10 10 0 00-14.142 0M17.657 6.343a8 8 0 00-11.314 0" />
            </svg>
          }
          @case ('profile') {
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          }
        }
        @if (isExpanded()) {
          <span>{{ item.label }}</span>
        }
      </button>
    }
  </nav>

  <div class="sidebar-bottom">
    <div class="user-profile">
      <div class="user-avatar" [attr.title]="!isExpanded() ? (currentUser()?.full_name || 'Customer') : null">
        {{ currentUser()?.full_name?.substring(0,1) || 'C' }}
      </div>
      @if (isExpanded()) {
        <div class="user-info">
          <h4>{{ currentUser()?.full_name || 'Customer' }}</h4>
          <span>{{ currentUser()?.role || 'Customer' }}</span>
        </div>
      }
    </div>
    
    <button
      type="button"
      class="logout-btn"
      (click)="selectView('logout')"
      [attr.title]="!isExpanded() ? 'Logout' : null"
    >
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      @if (isExpanded()) {
        <span>Logout</span>
      }
    </button>
  </div>
</aside>
